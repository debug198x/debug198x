# debug198x — the 198x family's cross-CPU debug-info format.
#
# An NDJSON sidecar (line<->address map, symbols, sections, address-space
# qualifiers) written by Asm198x and read by Emu198x. Extracted from Asm198x on
# 2026-08-27 under the family's graduation rule: a format moves out of the
# project that first needed it once it has a standalone consumer.
#
# The dependency direction is one-way and must stay that way — asm198x writes,
# Emu198x reads, and neither is depended on from here. A dependency back on
# asm198x would be circular and would defeat the point of the extraction, which
# is that reading a sidecar needs no assembler.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/debug198x/debug198x"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
