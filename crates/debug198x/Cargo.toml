[package]
name = "debug198x"
description = "The Debug198x cross-CPU debug-info format for the 198x family — NDJSON sidecar (line↔address map, symbols, sections, address-space qualifiers) written by Asm198x and read by Emu198x. Depends only on serde, so a consumer needs no assembler, parser, or CLI."
# Its own version, no longer the lockstep one. Inside Asm198x this crate rode
# the workspace version and reached 0.0.35 without most of those bumps saying
# anything about it. Released history restarts at 0.1.0 here, the same choice
# mediaspec198x made when it left build198x's lockstep.
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

# Depends only on serde + serde_json — the neutral footing of a data-contract
# crate. The dependency direction is one-way: asm198x -> debug198x (writer),
# Emu198x -> debug198x (reader). It must never depend on asm198x (would be
# circular). See ../../decisions/debug198x-format.md and the plan's KTD1.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
