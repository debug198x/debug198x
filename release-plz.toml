# release-plz configuration.
#
# On each push to main, release-plz opens (or updates) a "chore: release" PR
# (version bump + CHANGELOG from conventional-commit prefixes). Merging it makes
# release-plz.yml tag the crate and publish it to crates.io over OIDC in the same
# workflow run — no PAT, no stored registry token.
#
# Modelled on format198x, which is the same shape: a standalone published library
# with no binary and so no cargo-dist.
[workspace]
# release-plz publishes directly with crates.io Trusted Publishing. The
# workflow grants id-token: write; no stored registry token is involved.
publish = true
git_release_enable = true
git_tag_enable = true
changelog_update = true
# Only reader-facing changes earn a release. Release-process work uses `ci:` or
# `chore(release):`; changelog filtering alone does not prevent a version bump.
release_commits = "^(feat|fix|perf|revert)[(:]"
# Package-prefixed tags even with a single crate: it keeps a second crate
# unambiguous later, and a bare `v<version>` would collide with the tags this
# history carried inside Asm198x.
git_tag_name = "{{ package }}-v{{ version }}"

[changelog]
protect_breaking_commits = true
commit_parsers = [
  { message = '^chore(\([^)]*\))?: release\b', skip = true },
  { message = '^(feat|fix|perf|revert)\((ci|release)\)', skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^revert", group = "Reverted" },
  { message = '^(chore|build)\(deps\)', group = "Dependencies" },
  { message = "^(docs|test|chore|ci|build|refactor|style)", skip = true },
  { message = "^Merge", skip = true },
  { message = ".*", group = "Other" },
]
