# release-plz configuration.
#
# On each push to main, release-plz opens (or updates) a "chore: release" PR
# (version bump + CHANGELOG from conventional-commit prefixes). Merging it makes
# release-plz.yml tag the crate and publish it to crates.io over OIDC in the same
# workflow run — no PAT, no stored registry token.
#
# Modelled on format198x, which is the same shape: a standalone published library
# with no binary and so no cargo-dist.
[workspace]
# publish = false: release-plz itself does not run cargo publish; the release
# workflow does, over OIDC, gated on a release actually happening. release-plz
# only bumps, changelogs, tags, and cuts GitHub releases.
publish = false
# git_only: take the version baseline from the <crate>-v<version> git tag rather
# than the registry. Deterministic, and needs no registry token.
git_only = true
git_release_enable = true
git_tag_enable = true
changelog_update = true
# Package-prefixed tags even with a single crate: it keeps a second crate
# unambiguous later, and a bare `v<version>` would collide with the tags this
# history carried inside Asm198x.
git_tag_name = "{{ package }}-v{{ version }}"
